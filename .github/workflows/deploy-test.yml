name: Deploy TEST

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the TEST branch
        run: test "$GITHUB_REF" = refs/heads/test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate

  deploy:
    needs: manual-validation
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/test' &&
      ((github.event_name == 'push' && needs.manual-validation.result == 'skipped') ||
      (github.event_name == 'workflow_dispatch' && needs.manual-validation.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: test
    concurrency:
      group: test-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
      DEPLOY_EXECUTION_ROLE_ARN: ${{ vars.DEPLOY_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: 1.155.2
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: test-${{ github.run_id }}
      - name: Publish and verify the triggering commit
        run: corepack pnpm deploy:ci:test
