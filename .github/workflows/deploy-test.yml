name: Deploy TEST

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the TEST branch
        run: test "$GITHUB_REF" = refs/heads/test
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate

  deploy:
    needs: manual-validation
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/test' &&
      ((github.event_name == 'push' && needs.manual-validation.result == 'skipped') ||
      (github.event_name == 'workflow_dispatch' && needs.manual-validation.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: test
    concurrency:
      group: test-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
      DEPLOY_EXECUTION_ROLE_ARN: ${{ vars.DEPLOY_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: 1.155.2
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: test-${{ github.run_id }}
      - name: Publish and verify the triggering commit
        run: corepack pnpm deploy:ci:test
